<div class="app">
  <header class="top">
    <h1 class="brand"><span class="sr-only">Turnfall</span></h1>
    <div class="top-tools">
      <button class="icon-btn" id="open-daily" type="button" aria-label="Daily puzzle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      </button>
      <button class="icon-btn" id="open-levels" type="button" aria-label="Levels" aria-expanded="false" aria-controls="levels">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="12" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><path d="M8.5 6.5h4a3 3 0 0 1 3 3v0a3 3 0 0 0 3 3M6 8.5v7"></path></svg>
      </button>
      <button class="icon-btn" id="open-settings" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 16.9l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>
      </button>
    </div>
  </header>

  <main id="play">
    <div class="panel-top">
      <p class="kicker" id="kicker"></p>
      <div class="dash">
        <div class="stat" id="turns-card"><span class="label">Turns</span><span class="num" id="turns">0</span></div>
        <div class="dial" aria-hidden="true"><div class="needle" id="needle"></div></div>
        <div class="stat alt"><span class="label">Goal</span><span class="num" id="par"></span></div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board-card">
        <div id="stage">
          <svg id="board" viewBox="0 0 5 5" role="img" aria-label="The board. The ball falls down, and the hole is the goal.">
            <g id="world"></g>
            <g id="fx"></g>
            <g id="ball"><g id="ball-body"><circle r="0.3" class="ball"></circle><circle cx="-0.1" cy="-0.1" r="0.07" class="shine"></circle></g></g>
          </svg>
        </div>
      </div>
    </div>

    <div class="panel-bottom">
      <p class="msg" id="msg" aria-live="polite"></p>
      <div class="joy" id="joy" role="group" aria-label="Joystick to turn. Push it left or right. The arrow keys work too.">
        <svg class="joy-arrow l" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        <svg class="joy-arrow r" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
        <div class="joy-knob" id="joy-knob"></div>
      </div>
      <div class="tools">
        <button class="btn" id="undo" type="button" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"></path></svg>
          <b class="n" id="undo-label">2</b>
        </button>
        <button class="btn" id="hint" type="button" aria-label="Hint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
          <b class="n" id="hint-label">3</b>
        </button>
        <button class="btn" id="reset" type="button" aria-label="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
        </button>
      </div>
    </div>

    <div class="win" id="win" hidden>
      <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-text">
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <p class="stars" id="win-stars"></p>
        <p class="win-title" id="win-text"></p>
        <textarea class="copy-text" id="copy-text" readonly hidden aria-label="Result text, to copy"></textarea>
        <div class="tools">
          <button class="btn solid" id="next" type="button">Next</button>
          <button class="btn" id="win-map" type="button" hidden aria-label="Chapter map">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
          </button>
          <button class="btn" id="win-levels" type="button" aria-label="Levels">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="12" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><path d="M8.5 6.5h4a3 3 0 0 1 3 3v0a3 3 0 0 0 3 3M6 8.5v7"></path></svg>
          </button>
          <button class="btn" id="copy" type="button" aria-label="Copy result">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
            <span>Copy</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <section id="levels" class="sheet" aria-labelledby="levels-title" hidden>
    <div class="sheet-head">
      <h2 id="levels-title">Levels</h2>
      <button class="icon-btn" id="levels-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>
    <div class="sheet-body levels-body">
      <div class="col">
        <button class="daily-card" id="daily-card" type="button">
          <span class="d-title">Daily puzzle</span>
          <span class="d-stars" id="daily-stars"></span>
          <span class="d-sub" id="daily-sub"></span>
        </button>
        <div class="chapter-nav">
          <button class="nav-btn" id="ch-prev" type="button" aria-label="Previous chapter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
          </button>
          <h3 id="chapter-name"></h3>
          <button class="nav-btn" id="ch-next" type="button" aria-label="Next chapter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          </button>
        </div>
        <div class="tags" id="chapter-tags" aria-hidden="true"></div>
      </div>
      <div class="col">
        <div class="path levels-grid" id="levels-grid"></div>
        <button class="btn" id="chapter-map" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
          <span>Map</span>
        </button>
      </div>
    </div>
  </section>

  <section id="settings" class="sheet" aria-labelledby="settings-title" hidden>
    <div class="sheet-head">
      <h2 id="settings-title">Settings</h2>
      <button class="icon-btn" id="settings-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>
    <div class="sheet-body settings-body">
      <div class="col">
        <div class="field">
          <span class="field-label">Speed</span>
          <div class="seg-row">
            <button class="seg" id="speed-normal" type="button" aria-pressed="true">Normal</button>
            <button class="seg" id="speed-fast" type="button" aria-pressed="false">Fast</button>
            <button class="seg" id="speed-off" type="button" aria-pressed="false">Off</button>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Theme</span>
          <div class="seg-row">
            <button class="seg" id="theme-auto" type="button" aria-pressed="true">Auto</button>
            <button class="seg" id="theme-light" type="button" aria-pressed="false">Light</button>
            <button class="seg" id="theme-dark" type="button" aria-pressed="false">Dark</button>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Feedback</span>
          <div class="seg-row two">
            <button class="seg" id="sound-toggle" type="button" aria-pressed="false">Sound</button>
            <button class="seg" id="vibe-toggle" type="button" aria-pressed="true">Vibration</button>
          </div>
        </div>
      </div>
      <div class="col">
        <dl class="stats" id="stats"></dl>
        <button class="btn danger" id="reset-progress" type="button">Reset</button>
      </div>
    </div>
  </section>

  <section id="map" class="sheet over-map" aria-labelledby="map-title" hidden>
    <div class="sheet-head">
      <h2 id="map-title">Chapter map</h2>
      <button class="icon-btn" id="map-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>
    <div class="map-frame">
      <img class="map-img" id="map-img" alt="Map of the finished chapter">
      <p class="msg" id="map-note">Long-press the picture to save it.</p>
    </div>
  </section>
</div>
