<title>Turnfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Bright and playful, in the spirit of a casual puzzle game: rounded surfaces with a darker lower edge that gives them
   weight. The world, the ball and the joystick keep their own look; everything around them stays quiet. */
:root {
  direction: ltr;
  --paper: #e6eeff;
  --surface: #ffffff;
  --tile: #d3e2ff;
  --mud: #f2d08f;
  --mud-ink: #7d5a1e;
  --pit: #e5583c;
  --pit-ink: #3a0d05;
  --wall: #3d6cf2;
  --wall-lip: #2a4fc4;
  --ink: #1c2857;
  --ink-2: #5b6a9a;
  --line: rgba(28, 40, 87, 0.14);
  --edge: #b7c8ee;
  --sun: #ffc83d;
  --sun-edge: #1c2857;
  --vermilion: #f2552e;
  --hole: #0d1538;
  --on-sun: #1c2857;
  --on-ink: #ffffff;
  --focus: #f2552e;
  --scrim: rgba(13, 21, 56, 0.45);
  --turn: 420ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1334;
    --surface: #161f4a;
    --tile: #212d63;
    --mud: #6e5a2e;
    --mud-ink: #f0d495;
    --pit: #b8402a;
    --pit-ink: #080303;
    --wall: #7d9fff;
    --wall-lip: #6686f0;
    --ink: #eef2ff;
    --ink-2: #a3b0d6;
    --line: rgba(238, 242, 255, 0.14);
    --edge: #060b25;
    --sun: #ffc83d;
    --sun-edge: #050a20;
    --vermilion: #ff6b4a;
    --hole: #050a20;
    --on-sun: #0c1334;
    --on-ink: #0c1334;
    --focus: #ff6b4a;
    --scrim: rgba(5, 10, 32, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1334;
  --surface: #161f4a;
  --tile: #212d63;
  --mud: #6e5a2e;
  --mud-ink: #f0d495;
  --pit: #b8402a;
  --pit-ink: #080303;
  --wall: #7d9fff;
  --wall-lip: #6686f0;
  --ink: #eef2ff;
  --ink-2: #a3b0d6;
  --line: rgba(238, 242, 255, 0.14);
  --edge: #060b25;
  --sun: #ffc83d;
  --sun-edge: #050a20;
  --vermilion: #ff6b4a;
  --hole: #050a20;
  --on-sun: #0c1334;
  --on-ink: #0c1334;
  --focus: #ff6b4a;
  --scrim: rgba(5, 10, 32, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100vh; height: 100dvh; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Assistant', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 12px;
  -webkit-user-select: none;
  user-select: none;
}
h1, h2, h3 { font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; line-height: 1.05; margin: 0; text-wrap: balance; }
button { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; }

/* Top bar: a dot and three round buttons */
.top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; }
.brand { margin: 0; display: flex; align-items: center; }
.brand::before { content: ""; flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--sun); box-shadow: 0 2px 0 var(--edge); }
.top-tools { display: flex; gap: 10px; }
.icon-btn { flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; color: var(--ink); background: var(--surface); border: 0; border-radius: 50%; box-shadow: 0 3px 0 var(--edge); cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.btn svg, .icon-btn svg, .nav-btn svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* The play screen: its fixed parts take their natural height, and the world gets the rest */
#play { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.panel-top, .panel-bottom { display: contents; }
.kicker { margin: 4px 0 0; font-family: 'Secular One', 'Assistant', sans-serif; font-size: 32px; line-height: 1.1; text-align: center; }

/* The readout: turns on the right, the dial in the middle, the target on the left */
.dash { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 10px 0 0; padding: 10px 16px; background: var(--surface); border-radius: 20px; box-shadow: 0 4px 0 var(--edge); }
.stat { display: grid; min-width: 0; }
.stat.alt { justify-items: end; text-align: end; }
.stat.over .num { color: var(--vermilion); }
.label { font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--ink-2); }
.num { font-family: 'Secular One', 'Assistant', sans-serif; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.num.bump { animation: bump .32s ease-out; }
.dial { position: relative; width: 50px; height: 50px; border: 3px solid var(--ink); border-radius: 50%; }
.dial::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 3px; height: 6px; margin-left: -1.5px; background: var(--ink); }
.needle { position: absolute; inset: 0; transition: transform var(--turn) cubic-bezier(.45, .05, .25, 1); }
.needle::before { content: ""; position: absolute; left: 50%; bottom: 4px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--vermilion); }

/* The world: a square as large as the space allows, up to 360px */
.board-wrap { flex: 1 1 0; min-height: 0; display: grid; place-items: center; container-type: size; }
.board { position: relative; width: min(100%, 360px); width: min(100cqw, 100cqh, 360px); aspect-ratio: 1; padding: 10px; background: var(--surface); border: 0; border-radius: 22px; box-shadow: 0 6px 0 var(--edge); overflow: hidden; touch-action: manipulation; }
.board.shake { animation: shake .32s ease-in-out; }
#stage { width: 100%; aspect-ratio: 1; transition: transform var(--turn) cubic-bezier(.45, .05, .25, 1); }
#stage svg { display: block; width: 100%; height: auto; }
#board .tile { fill: var(--tile); }
#board .tile.mud { fill: var(--mud); }
#board .tile.pit { fill: var(--pit); }
#board .mudspot { fill: var(--mud-ink); opacity: 0.45; }
#board .pitdot { fill: var(--pit-ink); }
#board .arrow { fill: var(--ink); opacity: 0.75; }
#board .spring { fill: none; stroke: var(--ink); stroke-width: 0.07; stroke-linejoin: round; stroke-linecap: round; }
#board .wall { fill: var(--wall); }
#board .lip { fill: var(--wall-lip); }
#board .hole { fill: var(--hole); }
#board .goal { fill: none; stroke: var(--vermilion); stroke-width: 0.07; }
#board .goal.pulse { transform-box: fill-box; transform-origin: center; animation: ring .9s ease-out 2; }
#board .ball { fill: var(--sun); stroke: var(--sun-edge); stroke-width: 0.05; }
#board .shine { fill: #ffffff; opacity: 0.8; }
#board .trail { fill: none; stroke: var(--ink); stroke-width: 0.08; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.14 0.14; opacity: 0.55; }
#board .ghost { fill: var(--sun); fill-opacity: 0.6; stroke: var(--ink); stroke-width: 0.05; stroke-dasharray: 0.1 0.08; }
#board .ghost.win { fill-opacity: 1; stroke-dasharray: none; }
#board .ghost.mud { fill: var(--mud); fill-opacity: 1; stroke: var(--mud-ink); stroke-dasharray: none; }
#board .ghost.pit { fill: var(--vermilion); fill-opacity: 0.7; stroke: var(--vermilion); }
#board .ghost.wall { fill: var(--ink); fill-opacity: 0.16; }
#ball-body { transform-box: fill-box; transform-origin: center; transition: transform .3s ease, opacity .3s ease; }
#ball-body.land { animation: squash .38s ease-out; }
#ball-body.mud { transform: scale(0.8); }
#ball-body.drop { transform: scale(0.25); opacity: 0.25; }
#ball-body.sink { transform: scale(0); }

/* One line of text under the world. Its height stays fixed, so the world never moves when the text changes. */
.msg { min-height: 1.6em; margin: 12px 0 0; font-size: 15px; font-weight: 700; line-height: 1.6; color: var(--ink-2); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* The handle: a bar that slides left and right. Push it past half way to one side to see where the ball would go, and
   let go to turn that way. It springs back to the middle. Pushed less than half way, it turns nothing. */
.joy { --h: 64px; --gw: 68px; --gh: 48px; position: relative; flex: none; width: 100%; max-width: 300px; height: var(--h); margin: 10px auto 0; background: var(--surface); border: 0; border-radius: 999px; box-shadow: 0 4px 0 var(--edge); overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.joy::before { content: ""; position: absolute; left: 52px; right: 52px; top: 50%; height: 0; border-top: 2px dashed var(--line); }
.joy::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 50%; border-radius: 999px 0 0 999px; background: var(--tile); opacity: 0; pointer-events: none; transition: opacity .12s ease; }
.joy.pull-r::after { left: auto; right: 0; border-radius: 0 999px 999px 0; }
.joy.pull-l::after, .joy.pull-r::after { opacity: 1; }
.joy-arrow { position: absolute; z-index: 1; top: 50%; width: 22px; height: 22px; margin-top: -11px; fill: none; stroke: var(--ink-2); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.joy-arrow.l { left: 14px; }
.joy-arrow.r { right: 14px; }
.joy.pull-l .joy-arrow.l, .joy.pull-r .joy-arrow.r { stroke: var(--ink); }
.joy-knob { position: absolute; z-index: 1; left: 50%; top: 50%; width: var(--gw); height: var(--gh); margin: calc(var(--gh) / -2) 0 0 calc(var(--gw) / -2); border-radius: 16px; background: var(--sun); border: 2px solid var(--sun-edge); transition: transform .18s cubic-bezier(.2, .8, .2, 1); }
.joy-knob.held { transition: none; }
.joy-knob::after { content: ""; position: absolute; left: 50%; top: 50%; width: 2px; height: 20px; margin: -10px 0 0 -1px; border-radius: 2px; background: var(--on-sun); box-shadow: -7px 0 0 var(--on-sun), 7px 0 0 var(--on-sun); opacity: 0.6; }
.joy.off { opacity: 0.4; cursor: default; }
/* On the first visit the knob nudges twice, so the player sees that it moves */
.joy.teach .joy-knob { animation: nudge 1.2s ease-in-out 2; }

/* The buttons under the joystick: chunky, with a lower edge that the press pushes in */
.tools { display: flex; gap: 10px; margin-top: 10px; }
.btn { position: relative; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 12px; font: 700 15px/1.1 'Assistant', system-ui, sans-serif; color: var(--ink); background: var(--surface); border: 0; border-radius: 18px; box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.solid { color: var(--on-sun); background: var(--sun); }
.btn.danger { color: var(--vermilion); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn .n { position: absolute; top: -7px; inset-inline-end: -7px; min-width: 24px; height: 24px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px; background: var(--ink); color: var(--paper); font: 800 13px/1 'Assistant', system-ui, sans-serif; }
.btn:focus-visible, .icon-btn:focus-visible, .lvl:focus-visible, .seg:focus-visible, .daily-card:focus-visible, .nav-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* The level is done: a card over the world, so it shows at any scroll position */
.win { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: var(--scrim); animation: fade .3s ease both; }
.win-card { position: relative; display: grid; gap: 12px; width: min(100%, 340px); padding: 22px 20px 20px; background: var(--surface); border-radius: 26px; box-shadow: 0 8px 0 var(--edge); overflow: hidden; text-align: center; animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
.win-card .tools { flex-wrap: wrap; margin-top: 6px; }
.win-card .tools .btn { flex: 1 1 auto; }
.stars { margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-size: 44px; line-height: 1; letter-spacing: 2px; text-align: center; color: var(--vermilion); animation: pop .6s .1s cubic-bezier(.2, 1.4, .4, 1) both; }
.win-title { margin: 0; font-size: 17px; font-weight: 700; text-align: center; text-wrap: balance; }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: -14px; width: 9px; height: 13px; border-radius: 3px; background: var(--c); animation: fall var(--d) ease-in var(--t) both; }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(var(--dx), 440px) rotate(600deg); opacity: 0; } }
@keyframes nudge { 0%, 100% { transform: translate(0, 0); } 30% { transform: translate(-28px, 0); } 70% { transform: translate(28px, 0); } }
@keyframes squash { 0% { transform: scale(1.2, 0.8); } 45% { transform: scale(0.94, 1.06); } 100% { transform: scale(1); } }
@keyframes ring { from { transform: scale(1); opacity: 1; } to { transform: scale(1.9); opacity: 0; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }

/* Sheets: the level path, settings and the chapter map. Each one fits its screen, and nothing scrolls. */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 14px; overflow: hidden; background: var(--paper); padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet.over-map { z-index: 30; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 460px; margin: 0 auto; }
.sheet-head h2 { font-size: 30px; text-wrap: balance; }
.sheet-body { display: grid; align-content: start; gap: 14px; width: 100%; max-width: 460px; margin: 0 auto; min-height: 0; }
.sheet-body .col { display: grid; align-content: start; gap: 14px; min-width: 0; }
.daily-card { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; width: 100%; padding: 14px 16px; text-align: start; color: var(--ink); background: var(--surface); border: 0; border-radius: 20px; box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.daily-card .d-title { font-family: 'Secular One', 'Assistant', sans-serif; font-size: 22px; line-height: 1.1; }
.daily-card .d-sub { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.daily-card .d-stars { grid-row: 1 / span 2; grid-column: 2; font-size: 15px; letter-spacing: 1px; }
.chapter-nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.chapter-nav h3 { font-size: 26px; text-align: center; text-wrap: balance; }
.nav-btn { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; color: var(--ink); background: var(--surface); border: 0; border-radius: 50%; box-shadow: 0 3px 0 var(--edge); cursor: pointer; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
/* The mechanics of a chapter, as small pictures */
.tags { display: flex; justify-content: center; gap: 8px; min-height: 32px; }
.tag { display: grid; place-items: center; width: 32px; height: 32px; background: var(--surface); border-radius: 10px; box-shadow: 0 3px 0 var(--edge); }
.tag svg { width: 20px; height: 20px; }
/* The six levels of a chapter, on a path that winds from one to the next. Positions are percentages of the box. */
.path { position: relative; width: 100%; height: clamp(230px, 40dvh, 330px); }
.path-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.path-line polyline { fill: none; stroke: var(--ink-2); stroke-opacity: 0.35; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.lvl { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 58px; height: 58px; padding: 0; color: var(--ink); background: var(--surface); border: 0; border-radius: 50%; box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.lvl b { font-family: 'Secular One', 'Assistant', sans-serif; font-weight: 400; font-size: 24px; line-height: 1; }
.lvl .s { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 5px; font-size: 11px; line-height: 1; letter-spacing: 1px; color: var(--ink-2); white-space: nowrap; }
.lvl.done { color: var(--on-ink); background: var(--wall); }
.lvl.done .s { color: var(--ink); }
.lvl.cur { color: var(--on-sun); background: var(--sun); box-shadow: 0 0 0 5px var(--surface), 0 4px 0 var(--edge); animation: pulse 1.6s ease-in-out infinite; }

/* Settings: short labels, one row of choices each */
.field { display: grid; gap: 8px; }
.field-label { font-weight: 700; font-size: 15px; }
.seg-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg { min-height: 48px; font: 700 15px/1.1 'Assistant', system-ui, sans-serif; color: var(--ink); background: var(--surface); border: 0; border-radius: 16px; box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.seg[aria-pressed="true"] { color: var(--on-sun); background: var(--sun); }
.btn.danger[data-armed] { color: #ffffff; background: var(--vermilion); }

/* Statistics: a small grid of figures; an odd last figure takes the whole row */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
.stats > :last-child:nth-child(odd) { grid-column: 1 / -1; }
.stat-cell { display: grid; min-width: 0; padding: 8px 12px; background: var(--surface); border-radius: 16px; box-shadow: 0 3px 0 var(--edge); }
.stat-cell dt { font-size: 12px; line-height: 1.3; color: var(--ink-2); }
.stat-cell dd { margin: 0; font-family: 'Secular One', 'Assistant', sans-serif; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* The result as text, for the fallback when the clipboard is refused */
.copy-text { width: 100%; min-height: 64px; padding: 8px; font: inherit; font-size: 14px; line-height: 1.4; color: var(--ink); background: var(--paper); border: 0; border-radius: 14px; resize: none; direction: ltr; user-select: text; -webkit-user-select: text; }

/* The chapter map: a picture the player can keep */
.map-frame { display: grid; justify-items: center; align-content: start; gap: 12px; min-height: 0; }
.map-img { display: block; width: min(100%, 56dvh, 420px); height: auto; aspect-ratio: 1; border-radius: 22px; background: var(--surface); }

/* Motion. Each one answers an action; reduced motion turns them all off. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* A short portrait screen gets a smaller joystick, so the world keeps its room */
@media (orientation: portrait) and (max-height: 700px) {
  .joy { --h: 56px; --gw: 64px; --gh: 44px; }
}

/* Phones held sideways: the world on the left, the readout and controls in a column on the right */
@media (orientation: landscape) and (max-height: 560px) {
  body { padding-block: 6px 8px; }
  .app { max-width: 840px; }
  #play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); grid-template-rows: auto 1fr; column-gap: 24px; }
  .board-wrap { grid-column: 1; grid-row: 1 / -1; }
  .panel-top, .panel-bottom { display: flex; flex-direction: column; }
  .panel-top { grid-column: 2; grid-row: 1; }
  .panel-bottom { grid-column: 2; grid-row: 2; justify-content: flex-end; }
  .kicker { margin-top: 6px; font-size: 26px; }
  .dash { margin: 8px 0 10px; padding-block: 6px; }
  .num { font-size: 28px; }
  .msg { margin-top: 6px; }
  .joy { --h: 56px; --gw: 64px; --gh: 44px; max-width: 260px; }
  .tools { margin-top: 8px; }
  .btn { min-height: 44px; }
  .path { height: 200px; }
  .sheet-head, .sheet-body { max-width: 840px; }
  .sheet-body.levels-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); column-gap: 24px; }
  .sheet-body.settings-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 24px; }
}
</style>
<div class="app">
  <header class="top">
    <h1 class="brand"><span class="sr-only">Turnfall</span></h1>
    <div class="top-tools">
      <button class="icon-btn" id="open-daily" type="button" aria-label="Daily puzzle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>

  // ---- the play flow
  function updateUI() {
    $('turns').textContent = String(turns);
    $('par').textContent = String(LV.par);
    $('turns-card').className = 'stat' + (turns > LV.par ? ' over' : '');
    joy.classList.toggle('off', busy || won || failed);
    $('undo-label').textContent = String(undoLeft);
    $('undo').disabled = busy || won || undoLeft <= 0 || hist.length === 0;
    $('hint-label').textContent = String(hintsLeft);
    $('hint').disabled = busy || won || failed || hintsLeft <= 0;
  }
  // A fresh attempt: the ball settles under gravity, the undo allowance is back to two.
  function startAttempt() {
    var s0 = CORE.slide(grid, N, start[0], start[1], 0);
    pos = { x: s0.x, y: s0.y };
    g = 0; th = 0; turns = 0; hist = []; undoLeft = 2; hintsLeft = 3;
    busy = false; won = false; failed = false;
    drawWorld();
    clearFx();
    setRotation(0, true);
    ballBody.setAttribute('class', restClass());
    placeBall(pos.x, pos.y);
    msg(restMsg());
    updateUI();
  }
  function showPlay() {
    $('levels').hidden = true;
    $('settings').hidden = true;
    $('map').hidden = true;
    $('win').hidden = true;
    $('play').hidden = false;
  }
  function loadLevel(i) {
    mode = 'campaign'; level = i; LV = levelAt(i);
    setBoard(LV.rows);
    startAttempt();
    $('kicker').textContent = 'Level ' + (i + 1);
    showPlay();
  }
  function loadDaily(key) {
    mode = 'daily'; dayKey = key;
    var D = dailyFor(key);
    LV = { n: D.n, rows: D.rows, par: D.par };
    setBoard(LV.rows);
    startAttempt();
    $('kicker').textContent = 'Daily ' + dayLabel(key);
    showPlay();
  }
  function restart() {
    if (busy) return;
    if (mode === 'daily') loadDaily(dayKey); else loadLevel(level);
  }

  // A turn: the world rotates (dir 1 is right, clockwise; -1 is left), then the ball falls.
  function turn(dir) {
    if (busy || won || failed) return;
    clearFx();
    hist.push({ x: pos.x, y: pos.y, g: g, th: th, turns: turns });
    turns += 1;
    bump($('turns'));
    joy.classList.remove('teach');
    buzz(8);
    th += 90 * dir;
    g = (g + dir + 4) % 4;
    busy = true;
    ballBody.setAttribute('class', '');
    setRotation(th, false);
    msg('');
    updateUI();
    tone(330, 0.08, 'triangle', 0.04);
    setTimeout(fall, Math.round(TURN_MS * speed()));
  }
  function fall() {
    var r = CORE.slide(grid, N, pos.x, pos.y, g);
    if (!r.moved) {
      busy = false;
      shake();
      msg(MSG.noMove);
      updateUI();
      return;
    }
    walk(r.path, function () {
      pos = { x: r.x, y: r.y };
      if (r.end === 'win') { finish(); return; }
      if (r.end === 'pit') {
        failed = true; busy = false;
        tone(90, 0.35, 'sawtooth', 0.035); buzz([40, 60, 40]);
        ballBody.setAttribute('class', 'drop');
        shake();
        msg(MSG.pit);
        updateUI();
        return;
      }
      busy = false;
      if (r.end === 'mud') { ballBody.setAttribute('class', 'mud'); msg(MSG.mud); tone(120, 0.12, 'square', 0.025); }
      else { land(); msg(restMsg()); tone(180, 0.09, 'sine', 0.05); }
      updateUI();
    });
  }
  function undo() {
    if (busy || won || undoLeft <= 0 || !hist.length) return;
    clearFx();
    var h = hist.pop();
    pos = { x: h.x, y: h.y };
    g = h.g; th = h.th; turns = h.turns;
    undoLeft -= 1;
    failed = false;
    ballBody.setAttribute('class', restClass());
    setRotation(th, false);
    placeBall(pos.x, pos.y);
    msg(restMsg());
    updateUI();
  }
  // The hint shows the next turn of the fewest-turn solution, as the path it would take. Three per attempt. A hint
  // adds no turn, so it does not change the stars.
  function hint() {
    if (busy || won || failed) return;
    if (hintsLeft <= 0) { msg(MSG.hintOut); return; }
    var d = CORE.hint(grid, N, pos.x, pos.y, g);
    if (d === null) { msg(MSG.hintNone); return; }
    hintsLeft -= 1;
    previewFor(d === 'R' ? 1 : -1);
    msg('Hint: ' + $('msg').textContent);
    updateUI();
  }
  // The result as text, for sharing: where it was played, the stars, the turns and the target.
  var lastResult = '';
  function turnWord(n) { return n + (n === 1 ? ' turn' : ' turns'); }
  function resultText(st) {
    var where = mode === 'daily' ? 'Daily puzzle, ' + dayLabel(dayKey) : 'Level ' + (level + 1);
    return 'Turnfall · ' + where + ' · ' + starText(st) + ' · ' + turnWord(turns) + ' (goal ' + LV.par + ')';
  }
  // Copying runs inside the click. When the clipboard refuses, the text is shown selected, so it can be copied by hand.
  function copyResult() {
    var label = $('copy').querySelector('span');
    function done() {
      label.textContent = MSG.copied;
      setTimeout(function () { label.textContent = 'Copy'; }, 1500);
    }
    function fallback() {
      var box = $('copy-text');
      box.value = lastResult; box.hidden = false; box.focus(); box.select();
      try { if (document.execCommand('copy')) done(); } catch (e) { /* the text stays selected */ }
    }
    try { navigator.clipboard.writeText(lastResult).then(done, fallback); } catch (e) { fallback(); }
  }

  function finish() {
    won = true; busy = false; failed = false;
    var st = CORE.stars(turns, LV.par);
    record(st);
    ballBody.setAttribute('class', 'sink');
    tone(523, 0.12, 'triangle', 0.06); tone(659, 0.12, 'triangle', 0.06, 0.12); tone(784, 0.3, 'triangle', 0.06, 0.24);
    buzz(30);
    if (goalEl) goalEl.setAttribute('class', 'goal pulse');
    msg('');
    updateUI();
    // The result shows once the ball has sunk. A restart in the meantime leaves won false, so nothing shows.
    setTimeout(function () { if (won) showWin(st); }, 500);
  }
  function record(st) {
    var table = mode === 'daily' ? progress.daily : progress.best;
    var key = mode === 'daily' ? dayKey : level;
    var old = table[key];
    if (!old || st > old.s || (st === old.s && turns < old.t)) table[key] = { s: st, t: turns };
    saveProgress();
  }
  function showWin(st) {
    var campaign = mode === 'campaign';
    $('win-stars').textContent = starText(st);
    $('win-text').textContent = turnWord(turns) + ' · goal ' + LV.par;
    $('next').textContent = campaign ? 'Next' : 'Levels';
    if (st === 3) confetti(); else $('confetti').textContent = '';
    $('win-map').hidden = !(campaign && chapterDone(chapterOf(level)));
    $('win').hidden = false;
    // The next level is made while this one is on screen, so it is ready as soon as the player asks for it.
    if (campaign) setTimeout(function () { levelAt(level + 1); }, 0);
    lastResult = resultText(st);
    $('copy-text').hidden = true;
    $('next').focus();
  }

  // The confetti on a three-star win: small pieces that fall once, then are gone.
  function confetti() {
    var box = $('confetti'), cols = ['var(--sun)', 'var(--vermilion)', 'var(--wall)', 'var(--mud)'];
    box.textContent = '';
    for (var k = 0; k < 18; k++) {
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100).toFixed(1) + '%';
      p.style.setProperty('--c', cols[k % cols.length]);
      p.style.setProperty('--dx', ((Math.random() - 0.5) * 140).toFixed(0) + 'px');
      p.style.setProperty('--d', (1.3 + Math.random() * 0.9).toFixed(2) + 's');
      p.style.setProperty('--t', (Math.random() * 0.35).toFixed(2) + 's');
      box.appendChild(p);
    }
  }

  // ---- the handle turns the world. It slides left and right only, and follows the finger from where it went down, so a tap turns nothing.
  // Push past half of the travel: the half pushed toward shows where the ball would go. Let go, and the world turns that way.
  // Let go before that, or bring the knob back to the middle, and nothing turns. The keys work too.
  var joy = $('joy'), knobEl = $('joy-knob'), stick = null;
  function moveStick(e) {
    var s = stick, dx = Math.max(-s.R, Math.min(s.R, e.clientX - s.ox));
    knobEl.style.transform = 'translate(' + dx.toFixed(1) + 'px,0px)';
    var f = dx / s.R;
    var dir = f >= 0.5 ? 1 : f <= -0.5 ? -1 : 0;
    joy.classList.toggle('pull-r', dir > 0);
    joy.classList.toggle('pull-l', dir < 0);
    if (dir !== s.dir) { s.dir = dir; if (dir) previewFor(dir); else clearPreview(); }
  }
  joy.addEventListener('pointerdown', function (e) {
    if (e.button > 0 || stick || busy || won || failed) return;
    joy.classList.remove('teach');
    var r = joy.getBoundingClientRect(), kr = knobEl.getBoundingClientRect();
    stick = { id: e.pointerId, ox: e.clientX, R: r.width / 2 - kr.width / 2 - 4, dir: 0 };
    try { joy.setPointerCapture(e.pointerId); } catch (x) { /* optional */ }
    knobEl.classList.add('held');
  });
  joy.addEventListener('pointermove', function (e) { if (stick && e.pointerId === stick.id) moveStick(e); });
  function endStick(e, cancelled) {
    if (!stick || e.pointerId !== stick.id) return;
    var s = stick;
    stick = null;
    knobEl.classList.remove('held');
    knobEl.style.transform = '';
    joy.classList.remove('pull-l', 'pull-r');
    clearFx();
    if (!cancelled && s.dir && !busy && !won && !failed) turn(s.dir);
    else msg(restMsg());
  }
  joy.addEventListener('pointerup', function (e) { endStick(e, false); });
  joy.addEventListener('pointercancel', function (e) { endStick(e, true); });

  // ---- level select: a daily card, then one chapter at a time (the arrows step between chapters) and its six levels.
  // The chapters open as far as the first unfinished level, or the furthest level played.
  function maxChapter() {
    var first = 0;
    while (progress.best[first]) first += 1;
    var far = level;
    Object.keys(progress.best).forEach(function (k) { far = Math.max(far, +k); });
    return chapterOf(Math.max(first, far));
  }
  function openLevels() {
    if (mode === 'campaign') sheetChapter = chapterOf(level);
    sheetChapter = Math.max(0, Math.min(sheetChapter, maxChapter()));
    renderLevels();
    $('levels').hidden = false;
    $('open-levels').setAttribute('aria-expanded', 'true');
    $('levels-close').focus();
  }
  function closeLevels() {
    $('levels').hidden = true;
    $('open-levels').setAttribute('aria-expanded', 'false');
    (!$('win').hidden ? $('next') : $('open-levels')).focus();
  }
  // Where the six levels of a chapter sit on the path, in percent of its box: from the left along the top, then back along the bottom.
  var PATH_XY = [[18, 26], [50, 26], [82, 26], [82, 74], [50, 74], [18, 74]];
  function renderLevels() {
    var today = todayKey(), dd = progress.daily[today];
    $('daily-stars').textContent = starText(dd ? dd.s : 0);
    $('daily-sub').textContent = dayLabel(today);
    $('chapter-name').textContent = chapterTitle(sheetChapter);
    var tags = $('chapter-tags');
    tags.textContent = '';
    chapterInfo(sheetChapter).tags.forEach(function (t) {
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.innerHTML = TAG_SVG[t];
      tags.appendChild(tag);
    });
    $('ch-prev').disabled = sheetChapter === 0;
    $('ch-next').disabled = sheetChapter >= maxChapter();
    var box = $('levels-grid');
    box.textContent = '';
    var line = el('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', class: 'path-line', 'aria-hidden': 'true' }, box);
    el('polyline', { points: PATH_XY.map(function (p) { return p.join(','); }).join(' ') }, line);
    [0, 1, 2, 3, 4, 5].forEach(function (k) {
      var i = sheetChapter * 6 + k, best = progress.best[i], st = best ? best.s : 0, par = levelAt(i).par;
      var b = document.createElement('button'), n = document.createElement('b'), s = document.createElement('span');
      b.type = 'button';
      b.className = 'lvl' + (mode === 'campaign' && i === level ? ' cur' : '') + (st ? ' done' : '');
      b.style.left = PATH_XY[k][0] + '%';
      b.style.top = PATH_XY[k][1] + '%';
      n.textContent = String(i + 1);
      s.className = 's'; s.textContent = starText(st);
      b.append(n, s);
      b.setAttribute('aria-label', 'Level ' + (i + 1) + ', goal ' + par + (st ? ', ' + st + ' of 3 stars' : ''));
      b.addEventListener('click', function () { loadLevel(i); closeLevels(); });
      box.appendChild(b);
    });
    $('chapter-map').disabled = !chapterDone(sheetChapter);
  }

  // ---- the chapter map: drawn on a canvas, shown as a picture the player can save
  function chapterMap(ch) {
    var S = 720, c = document.createElement('canvas');
    c.width = S; c.height = S;
    var ctx = c.getContext('2d'), css = getComputedStyle(document.documentElement);
    var tok = function (v, d) { return css.getPropertyValue(v).trim() || d; };
    var ink = tok('--ink', '#101a2e'), paper = tok('--surface', '#ffffff'), sun = tok('--sun', '#ffd23f');
    var ink2 = tok('--ink-2', '#4b5870'), tile = tok('--tile', '#e3eaf4'), red = tok('--vermilion', '#e8462a');
    ctx.fillStyle = paper; ctx.fillRect(0, 0, S, S);
    ctx.strokeStyle = ink; ctx.lineWidth = 8; ctx.strokeRect(14, 14, S - 28, S - 28);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = ink; ctx.font = '400 60px "Secular One", Assistant, sans-serif';
    ctx.fillText(chapterInfo(ch).name, S / 2, 96);
    var got = 0;
    for (var k = 0; k < 6; k++) if (progress.best[ch * 6 + k]) got += progress.best[ch * 6 + k].s;
    ctx.fillStyle = ink2; ctx.font = '600 28px Assistant, sans-serif';
    ctx.fillText((ch < CHAPTERS.length ? 'Chapter ' + (ch + 1) + ' · ' : '') + got + ' of 18 stars', S / 2, 158);
    var at = [[0.22, 0.38], [0.5, 0.34], [0.78, 0.42], [0.62, 0.6], [0.3, 0.6], [0.5, 0.76]].map(function (p) {
      return { x: p[0] * S, y: p[1] * S };
    });
    ctx.strokeStyle = ink; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    at.forEach(function (p, i) { if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); });
    ctx.stroke();
    at.forEach(function (p, k) {
      var b = progress.best[ch * 6 + k], st = b ? b.s : 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, 50, 0, Math.PI * 2);
      ctx.fillStyle = st === 3 ? sun : st ? tile : paper;
      ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = ink;
      if (!st) ctx.setLineDash([10, 9]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ink; ctx.font = '400 40px "Secular One", Assistant, sans-serif';
      ctx.fillText(String(k + 1), p.x, p.y + 2);
      ctx.fillStyle = red; ctx.font = '700 26px Assistant, sans-serif';
      ctx.fillText(starText(st), p.x, p.y + 80);
    });
    ctx.fillStyle = red; ctx.font = '400 30px "Secular One", Assistant, sans-serif';
    ctx.fillText('Turnfall', S / 2, S - 40);
    return c.toDataURL('image/png');
  }
  function openMap(ch) {
    mapFrom = document.activeElement;
    $('map-title').textContent = chapterTitle(ch);
    $('map-note').textContent = 'Long-press the picture to save it.';
    $('map-img').removeAttribute('src');
    $('map').hidden = false;
    $('map-close').focus();
    var fonts = document.fonts && document.fonts.load
      ? Promise.all([document.fonts.load('400 60px "Secular One"'), document.fonts.load('600 28px "Assistant"')]).catch(function () {})
      : Promise.resolve();
    var waited = new Promise(function (done) { setTimeout(done, 1200); });
    Promise.race([fonts, waited]).then(function () {
      try { $('map-img').src = chapterMap(ch); }
      catch (e) { $('map-note').textContent = 'Could not show it.'; }
    });
  }
  function closeMap() {
    $('map').hidden = true;
    if (mapFrom && mapFrom.focus) mapFrom.focus();
  }

  // ---- settings: the speed of the animation, and resetting the progress (two taps)
  function openSettings() {
    renderSettings();
    armReset(false);
    $('settings').hidden = false;
    $('open-settings').setAttribute('aria-expanded', 'true');
    $('settings-close').focus();
  }
  function closeSettings() {
    $('settings').hidden = true;
    $('open-settings').setAttribute('aria-expanded', 'false');
    $('open-settings').focus();
  }
  function renderSettings() {
    ['normal', 'fast', 'off'].forEach(function (s) {
      $('speed-' + s).setAttribute('aria-pressed', String(settings.speed === s));
    });
    ['auto', 'light', 'dark'].forEach(function (t) {
      $('theme-' + t).setAttribute('aria-pressed', String(settings.theme === t));
    });
    $('sound-toggle').setAttribute('aria-pressed', String(settings.sound));
    $('vibe-toggle').setAttribute('aria-pressed', String(settings.vibe));
    renderStats();
  }
  // The figures come from this browser's progress: levels solved, three-star levels, stars, daily puzzles, and the streak.
  function renderStats() {
    var solved = 0, threes = 0, starSum = 0, key;
    for (key in progress.best) {
      if (!progress.best.hasOwnProperty(key)) continue;
      solved += 1; starSum += progress.best[key].s;
      if (progress.best[key].s === 3) threes += 1;
    }
    var streak = 0, d = new Date();
    if (!progress.daily[todayKey()]) d.setUTCDate(d.getUTCDate() - 1);
    while (progress.daily[dateKey(d)]) { streak += 1; d.setUTCDate(d.getUTCDate() - 1); }
    var cells = [
      ['Solved', String(solved)],
      ['Three stars', String(threes)],
      ['Stars', String(starSum)],
      ['Daily puzzles', String(Object.keys(progress.daily).length)],
      ['Streak', String(streak)]
    ];
    var box = $('stats');
    box.textContent = '';
    cells.forEach(function (c) {
      var w = document.createElement('div'), dt = document.createElement('dt'), dd = document.createElement('dd');
      w.className = 'stat-cell';
      dt.textContent = c[0]; dd.textContent = c[1];
      w.append(dt, dd);
      box.appendChild(w);
    });
  }
  // Speed, and the page's colour scheme: auto follows the system, light and dark set it explicitly.
  function applySettings() {
    setTurnSpeed();
    if (settings.theme === 'light' || settings.theme === 'dark') document.documentElement.setAttribute('data-theme', settings.theme);
    else document.documentElement.removeAttribute('data-theme');
  }
  var armTimerId = 0;
  function armReset(on) {
    var b = $('reset-progress');
    clearTimeout(armTimerId);
    if (on) {
      b.setAttribute('data-armed', '');
      b.textContent = 'Sure?';
      armTimerId = setTimeout(function () { armReset(false); }, 4000);
    } else {
      b.removeAttribute('data-armed');
      b.textContent = 'Reset';
    }
  }

  // ---- wiring
  $('undo').addEventListener('click', undo);
  $('hint').addEventListener('click', hint);
  $('copy').addEventListener('click', copyResult);
  $('reset').addEventListener('click', restart);
  $('next').addEventListener('click', function () {
    if (mode === 'daily') { $('win').hidden = true; openLevels(); return; }
    loadLevel(level + 1);
  });
  $('win-map').addEventListener('click', function () { openMap(chapterOf(level)); });
  $('win-levels').addEventListener('click', openLevels);
  $('open-levels').addEventListener('click', openLevels);
  $('levels-close').addEventListener('click', closeLevels);
  $('ch-prev').addEventListener('click', function () { if (sheetChapter > 0) { sheetChapter -= 1; renderLevels(); } });
  $('ch-next').addEventListener('click', function () { if (sheetChapter < maxChapter()) { sheetChapter += 1; renderLevels(); } });
  $('open-daily').addEventListener('click', function () { loadDaily(todayKey()); });
  $('daily-card').addEventListener('click', function () { loadDaily(todayKey()); closeLevels(); });
  $('chapter-map').addEventListener('click', function () { openMap(sheetChapter); });
  $('map-close').addEventListener('click', closeMap);
  $('open-settings').addEventListener('click', openSettings);
  $('settings-close').addEventListener('click', closeSettings);
  ['auto', 'light', 'dark'].forEach(function (t) {
    $('theme-' + t).addEventListener('click', function () { settings.theme = t; saveSettings(); applySettings(); renderSettings(); });
  });
  $('sound-toggle').addEventListener('click', function () {
    settings.sound = !settings.sound; saveSettings(); renderSettings();
    tone(660, 0.08, 'triangle', 0.05);
  });
  $('vibe-toggle').addEventListener('click', function () {
    settings.vibe = !settings.vibe; saveSettings(); renderSettings();
    buzz(20);
  });
  ['normal', 'fast', 'off'].forEach(function (s) {
    $('speed-' + s).addEventListener('click', function () { settings.speed = s; saveSettings(); applySettings(); renderSettings(); });
  });
  $('reset-progress').addEventListener('click', function () {
    if (!$('reset-progress').hasAttribute('data-armed')) { armReset(true); return; }
    progress = { best: {}, daily: {} };
    saveProgress();
    armReset(false);
    msg(MSG.reset);
  });
  document.addEventListener('keydown', function (e) {
    if (!$('map').hidden) { if (e.key === 'Escape') closeMap(); return; }
    if (!$('settings').hidden) { if (e.key === 'Escape') closeSettings(); return; }
    if (!$('levels').hidden) { if (e.key === 'Escape') closeLevels(); return; }
    if ($('play').hidden || !$('win').hidden) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); turn(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); turn(-1); }
    else if (e.key === 'z' || e.key === 'Z') undo();
    else if (e.key === 'h' || e.key === 'H') hint();
  });

  // ---- start on the first level that is not finished yet
  applySettings();
  var first = 0;
  while (progress.best[first]) first += 1;
  loadLevel(first);
  // The very first visit: the knob nudges, so the player finds out that it moves. No text is needed.
  if (!Object.keys(progress.best).length) joy.classList.add('teach');
})();
</script>
